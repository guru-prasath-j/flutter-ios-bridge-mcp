# Generated by flutter-ios-bridge-mcp. Safe to edit; regenerate with ci_generate_workflow(overwrite=true).
name: iOS build (flutter-ios-bridge)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "simulator = .app for the iOS Simulator, unsigned-ipa = for re-signing/sideloading, signed-ipa = installable/TestFlight build"
        type: choice
        options: [unsigned-ipa, simulator, signed-ipa]
        default: unsigned-ipa
      export_method:
        description: "Signed builds only"
        type: choice
        options: [app-store-connect, ad-hoc, release-testing, development]
        default: app-store-connect
      testflight:
        description: "Upload the signed IPA to TestFlight"
        type: boolean
        default: false
      build_name:
        description: "Override version name (e.g. 1.2.0); empty = pubspec"
        type: string
        default: ""
      build_number:
        description: "Override build number; empty = pubspec"
        type: string
        default: ""
      request_id:
        description: "Correlation id used by flutter-ios-bridge to find this run"
        type: string
        default: ""

run-name: "iOS ${{ inputs.build_type }} ${{ inputs.request_id }}"

jobs:
  ios:
    runs-on: __RUNNER__
    timeout-minutes: 60
    defaults:
      run:
        working-directory: __PROJECT_DIR__
    env:
      OUT: ${{ github.workspace }}/bridge-out
      BUILD_NAME: ${{ inputs.build_name }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      BUILD_TYPE: ${{ inputs.build_type }}
      EXPORT_METHOD: ${{ inputs.export_method }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
__FLUTTER_VERSION_LINE__          cache: true

      - name: Environment
        run: |
          mkdir -p "$OUT"
          xcodebuild -version
          flutter --version

      - name: Build arguments
        run: |
          ARGS=""
          if [ -n "$BUILD_NAME" ]; then ARGS="$ARGS --build-name=$BUILD_NAME"; fi
          if [ -n "$BUILD_NUMBER" ]; then ARGS="$ARGS --build-number=$BUILD_NUMBER"; fi
          echo "FLUTTER_ARGS=$ARGS" >> "$GITHUB_ENV"

      - name: flutter pub get
        run: flutter pub get

      # ------------------------------------------------------------ simulator
      - name: Build for iOS Simulator
        if: inputs.build_type == 'simulator'
        run: |
          flutter build ios --simulator --debug $FLUTTER_ARGS
          (cd build/ios/iphonesimulator && zip -qry "$OUT/Runner-simulator.app.zip" Runner.app)

      # ------------------------------------------------------------ unsigned
      - name: Build unsigned IPA
        if: inputs.build_type == 'unsigned-ipa'
        run: |
          flutter build ios --release --no-codesign $FLUTTER_ARGS
          rm -rf "$RUNNER_TEMP/unsigned" && mkdir -p "$RUNNER_TEMP/unsigned/Payload"
          cp -R build/ios/iphoneos/Runner.app "$RUNNER_TEMP/unsigned/Payload/"
          (cd "$RUNNER_TEMP/unsigned" && zip -qry "$OUT/Runner-unsigned.ipa" Payload)

      # ------------------------------------------------------------ signed
      - name: Install certificate and provisioning profile
        if: inputs.build_type == 'signed-ipa'
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$P12_BASE64" ] || [ -z "$PROFILE_BASE64" ]; then
            echo "::error::Signing secrets missing. Run the MCP tool signing_quick_setup (or ci_set_signing_secrets)."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/bridge.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PB=/usr/libexec/PlistBuddy
          UUID=$($PB -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$($PB -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$($PB -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          APP_ID=$($PB -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          BUNDLE_ID="${APP_ID#*.}"
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d" && cp "$RUNNER_TEMP/profile.mobileprovision" "$d/$UUID.mobileprovision"
          done

          if [ "$EXPORT_METHOD" = "development" ]; then IDENTITY="Apple Development"; else IDENTITY="Apple Distribution"; fi
          python3 "$GITHUB_WORKSPACE/.github/scripts/ios_manual_signing.py" \
            ios/Runner.xcodeproj/project.pbxproj "$BUNDLE_ID" "$TEAM_ID" "$PROFILE_NAME" "$IDENTITY"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>$IDENTITY</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"
          echo "Signing $BUNDLE_ID with '$PROFILE_NAME' (team $TEAM_ID, $IDENTITY, $EXPORT_METHOD)"

      - name: Build signed IPA
        if: inputs.build_type == 'signed-ipa'
        run: |
          flutter build ipa --release --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" $FLUTTER_ARGS
          cp build/ios/ipa/*.ipa "$OUT/"

      - name: Upload to TestFlight
        if: inputs.build_type == 'signed-ipa' && inputs.testflight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$ASC_KEY_ID" ]; then echo "::error::ASC_* secrets missing (ci_set_signing_secrets include_asc_key=true)"; exit 1; fi
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_PRIVATE_KEY" > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          IPA=$(ls "$OUT"/*.ipa | head -n1)
          xcrun altool --upload-app --type ios -f "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove keychain
        if: always() && inputs.build_type == 'signed-ipa'
        run: security delete-keychain "$RUNNER_TEMP/bridge.keychain-db" || true

      # ------------------------------------------------------------ outputs
      - name: Upload build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ inputs.build_type }}
          path: bridge-out/
          retention-days: 14

      - name: Summary
        if: always()
        run: |
          {
            echo "### flutter-ios-bridge"
            echo "- build type: \`$BUILD_TYPE\`"
            echo "- files:"; ls -la "$OUT" 2>/dev/null | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
