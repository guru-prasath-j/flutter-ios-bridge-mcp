[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "flutter-ios-bridge-mcp"
version = "0.1.0"
description = "MCP server that lets Flutter developers on Windows/Linux build, sign, ship and debug iOS apps without owning a Mac."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Guruprasath J" }]
requires-python = ">=3.10"
keywords = ["mcp", "flutter", "ios", "xcode", "testflight", "github-actions", "app-store-connect"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "mcp>=1.9",
  "httpx>=0.27",
  "pyjwt>=2.8",
  "cryptography>=41",
  "paramiko>=3.4",
  "pynacl>=1.5",
  "pyyaml>=6.0",
  "anyio>=4",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
device = ["pymobiledevice3>=4.0"]
dev = ["pytest>=8"]

[project.scripts]
flutter-ios-bridge-mcp = "flutter_ios_bridge.cli:main"

[project.urls]
Homepage = "https://github.com/guru-prasath-j/flutter-ios-bridge-mcp"
Issues = "https://github.com/guru-prasath-j/flutter-ios-bridge-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/flutter_ios_bridge"]
